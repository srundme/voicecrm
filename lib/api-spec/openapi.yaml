        - name: assignedTo
          in: query
          required: false
          schema: { type: string }
        - name: dateFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: sortBy
          in: query
