components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER]
    InsuranceType:
      type: string
      enum: [LIFE, HEALTH, MOTOR, TERM, ULIP, ENDOWMENT, ACCIDENT, TRAVEL]
    LeadSource:
      type: string
      enum: [META_ADS, WEBSITE_FORM, CSV_UPLOAD, MANUAL, INBOUND_CALL, REFERRAL]
    LeadStage:
      type: string
      enum: [NEW, CONTACTED, INTERESTED, DOCS_PENDING, POLICY_ISSUED, RENEWAL_DUE, LOST, DO_NOT_CALL, COLD]
    PolicyStatus:
      type: string
      enum: [ACTIVE, LAPSED, SURRENDERED, MATURED, CLAIMED]
    PremiumFreq:
      type: string
      enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY, SINGLE]
    CallDir:
      type: string
      enum: [OUTBOUND, INBOUND]
    CallStatus:
      type: string
      enum: [INITIATED, RINGING, IN_PROGRESS, COMPLETED, FAILED, NO_ANSWER, BUSY, CANCELLED]
    AutomationType:
      type: string
      enum: [AUTO_CALL_ON_LEAD, RETRY_ON_DROP, SCHEDULED_FOLLOWUP, MONTHLY_CHECKIN]
    FollowUpType:
      type: string
      enum: [RENEWAL_REMINDER, MONTHLY_CHECKIN, CALLBACK_REQUESTED, MANUAL, POLICY_ANNIVERSARY, REFERRAL, RETRY_NO_ANSWER]
    FollowUpStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, COMPLETED, SKIPPED, RESCHEDULED]

    ApiConfig:
      type: object
      required: [id, org_id, bolna_base_url, webhook_secret, context_api_bearer_token, context_api_url, meta_webhook_url, website_form_webhook_url]
      properties:
        id: { type: string }
        org_id: { type: string }
        bolna_api_key: { type: ["string", "null"] }
        bolna_base_url: { type: string }
        brevo_api_key: { type: ["string", "null"] }
        brevo_sender_name: { type: ["string", "null"] }
        meta_ads_access_token: { type: ["string", "null"] }
        meta_ads_account_id: { type: ["string", "null"] }
        webhook_secret: { type: string }
        context_api_bearer_token: { type: string }
        monthly_checkin_agent_id: { type: ["string", "null"] }
        sms_on_lead_created: { type: boolean }
        sms_on_call_scheduled: { type: boolean }
        email_renewal_reminders: { type: boolean }
        context_api_url: { type: string }
        meta_webhook_url: { type: string }
        website_form_webhook_url: { type: string }
        updated_at: { type: string, format: date-time }
    ApiConfigUpdate:
      type: object
      properties:
        bolna_api_key: { type: string }
        bolna_base_url: { type: string }
        brevo_api_key: { type: string }
        brevo_sender_name: { type: string }
        meta_ads_access_token: { type: string }
        meta_ads_account_id: { type: string }
        monthly_checkin_agent_id: { type: string }
        sms_on_lead_created: { type: boolean }
        sms_on_call_scheduled: { type: boolean }
        email_renewal_reminders: { type: boolean }
    TestConnectionResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
