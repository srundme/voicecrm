      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum: [bolna, brevo, meta]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestConnectionResult"

