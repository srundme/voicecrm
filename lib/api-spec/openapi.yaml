openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: settings
    description: API config and settings
  - name: leads
    description: CRM leads
  - name: policies
    description: Insurance policies
  - name: followups
    description: Follow-ups
  - name: calllogs
    description: Call logs
  - name: dispositions
    description: Dispositions
  - name: automations
    description: Automations
  - name: agents
    description: Bolna agents and phone numbers
  - name: dashboard
    description: Dashboard aggregates
  - name: leadsources
    description: Lead sources
  - name: team
    description: Team members
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /settings/api-config:
    get:
      operationId: getApiConfig
      tags: [settings]
      summary: Get API config
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiConfig"
    put:
      operationId: updateApiConfig
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiConfigUpdate"
      responses:
        "200":
          description: OK
          content:
